name: Content fix
description: A typo, broken link, or factual error in a post or page.
labels: [content]
body:
  - type: input
    id: url
    attributes:
      label: Page
      placeholder: https://et-cs.github.io/blog/...
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What should change?
      description: Quote the text as it is now and what it should say.
    validations:
      required: true
